<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entraînement HTML-CSS</title>
<!--Description de la page pour les moteurs de recherche-->
    <meta name="description" content="Apprendre les couleurs en espagnol : azul, amarillo, rosado, naranja, rojo et verde.">    
<!--Connexion anticipée Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--Police Story Script uniquement-->
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Story+Script&display=swap" rel="stylesheet">
<!-- lien vers la page style.css-->
    <link rel="stylesheet" href="./style.css">
</head>
<!--Corps du site-->
<body>
    <main>
        <h1 class="police">Les couleurs en Espagnol</h1>
        <h2 class="couleur" id="bleu">Azul</h2>
            <img src="./images/Bleu.png" alt="Couleur Bleu: Azul">
        <h2 class="couleur" id="rose">Rosado</h2>
            <img src="./images/Rose.png" alt="Couleur Rose: Rosa">
        <h2 class="couleur" id="orange">Naranja</h2>
            <img src="./images/Orange.png" alt="Couleur Orange: Naranja">
        <h2 class="couleur" id="rouge">Rojo</h2>
            <img src="./images/Rouge.png" alt="Couleur Rouge: Rojo">
        <h2 class="couleur" id="vert">Verde</h2>
            <img src="./images/Vert.png" alt="Couleur Vert: Verde">
   </main>
</body>
</html>
